# ワークフローの名前
name: frontend_ci

# トリガーになる Github イベント
on:
  pull_request:
    branches:
      - main # main ブランチへのプルリクエストで実行
  # 手動実行も可能にする
  workflow_dispatch:

# ジョブ定義
jobs:
  # リントチェックジョブ
  frontend_lint_check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 使用するNode.jsのバージョンを定義
        node-version: [20.10.0]
    # GitHub Actionsの権限設定
    permissions:
      contents: read
      pull-requests: write
    steps:
      # リポジトリからソースコードの取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          # 利用したいNode.jsバージョンを指定
          node-version: ${{ matrix.node-version }}
          # npmのキャッシュを使用する設定
          cache: 'npm'
          # ルート直下なのでパス修正
          cache-dependency-path: ./package-lock.json

      # プロジェクトの依存関係をインストール
      - name: Install Dependencies
        run: npm ci

      # ESLintを実行
      - name: Run ESLint
        run: npm run lint

      # TypeScriptの型チェックを実行
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

  # ビルドチェックジョブ
  frontend_build_check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.10.0]
    steps:
      # リポジトリからソースコードの取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      # プロジェクトの依存関係をインストール
      - name: Install Dependencies
        run: npm ci

      # Prismaクライアントを生成（ビルドに必要）
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # ビルド時はダミーのDATABASE_URLでOK（実際の接続は不要）
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      # Next.jsのビルドを実行
      - name: Build Next.js Application
        run: npm run build
        env:
          # ビルドに必要な環境変数（ダミー値でOK）
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          AUTH_SECRET: 'dummy-secret-for-ci-build-only'
          AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'
