# ワークフローの名前
name: frontend_ci

# トリガーになる Github イベント
on:
  pull_request:
    branches:
      - main # main ブランチへのプルリクエストで実行
  # 手動実行も可能にする
  workflow_dispatch:

# ジョブ定義
jobs:
  # リントチェックジョブ(ESLintとかで品質を保つ)
  frontend_lint_check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 使用するNode.jsのバージョンを定義
        node-version: [20.10.0]
    # GitHub Actionsの権限設定
    permissions:
      contents: read
      pull-requests: write
    steps:
      # リポジトリからソースコードの取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          # 利用したいNode.jsバージョンを指定
          node-version: ${{ matrix.node-version }}
          # npmのキャッシュを使用する設定
          cache: 'npm'
          # ルート直下なのでパス修正
          cache-dependency-path: ./package-lock.json

      # プロジェクトの依存関係をインストール
      - name: Install Dependencies
        run: npm ci

      # ESLintを実行
      - name: Run ESLint
        run: npm run lint

  # ビルドチェックジョブ(ビルドできるかを確認)
  frontend_build_check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.10.0]
    steps:
      # リポジトリからソースコードの取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      # プロジェクトの依存関係をインストール
      - name: Install Dependencies
        run: npm ci

      # Docker ComposeでPostgreSQLを起動（ビルドに必要）
      - name: Start PostgreSQL with Docker Compose
        run: docker compose up -d

      # PostgreSQLが起動するまで待機
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'until docker exec postgres pg_isready -U root; do sleep 2; done'
          echo "PostgreSQL is ready!"

      # Next.jsのビルドを実行（prisma migrate deployも含まれる）
      - name: Build Next.js Application
        run: npm run build
        env:
          # docker-compose.ymlの設定に合わせたDATABASE_URL
          DATABASE_URL: 'postgresql://root:secret@localhost:5432/mydb'
          AUTH_SECRET: 'dummy-secret-for-ci-build-only'
          AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_SUPABASE_URL: 'https://dummy.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-key'

      # クリーンアップ: Docker Composeを停止
      - name: Stop Docker Compose
        if: always()
        run: docker compose down
