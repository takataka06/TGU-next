# インフラストラクチャテスト用のワークフロー
name: infrastructure_test

# トリガーになる Github イベント
on:
  pull_request:
    branches:
      - main # main ブランチへのプルリクエストで実行
  # 手動実行も可能にする
  workflow_dispatch:

# ジョブ定義
jobs:
  # データベースマイグレーションテスト
  database_migration_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.10.0]
    steps:
      # リポジトリからソースコードの取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node.jsのセットアップ
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      # プロジェクトの依存関係をインストール
      - name: Install Dependencies
        run: npm ci

      # Docker ComposeでPostgreSQLを起動
      - name: Start PostgreSQL with Docker Compose
        run: docker compose up -d

      # PostgreSQLが起動するまで待機
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 60 bash -c 'until docker exec postgres pg_isready -U root; do sleep 2; done'
          echo "PostgreSQL is ready!"

      # データベース接続URLを設定（docker-compose.ymlの設定に合わせる）
      - name: Run Prisma Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://root:secret@localhost:5432/mydb'

      # Prismaクライアントを生成
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://root:secret@localhost:5432/mydb'

      # マイグレーションが正しく適用されたか確認（スキーマの検証）
      - name: Validate Database Schema
        run: npx prisma validate
        env:
          DATABASE_URL: 'postgresql://root:secret@localhost:5432/mydb'

      # クリーンアップ: Docker Composeを停止
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v
